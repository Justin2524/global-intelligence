<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="description" content="{{ site.description | escape }}">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action https://github.com; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}Global Intelligence</title>
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</head>
<body>
<a class="skip" href="#main">跳到正文</a>
<div class="edition-bar"><div class="shell"><span>独立阅读 · 全球视野</span><a href="https://github.com/{{ site.repository }}/issues/new?template=publish-report.yml">提交报告 <span aria-hidden="true">↗</span></a></div></div>
<header class="shell masthead">
  <a class="wordmark" href="{{ '/' | relative_url }}">Global Intelligence<span class="brand-dot" aria-hidden="true">.</span></a>
  <p>记录世界的变化，理解变化的逻辑。</p>
</header>
<nav class="main-nav" aria-label="主导航"><div class="shell nav-links">
  <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>首页</a>
  <a href="{{ '/daily/' | relative_url }}" {% if page.section == 'daily' %}aria-current="page"{% endif %}>Daily Briefings</a>
  <a href="{{ '/weekly/' | relative_url }}" {% if page.section == 'weekly' %}aria-current="page"{% endif %}>Weekly Economist</a>
  <a href="{{ '/topics/' | relative_url }}" {% if page.section == 'topics' %}aria-current="page"{% endif %}>Topics <span>专题</span></a>
  <a href="{{ '/knowledge/' | relative_url }}" {% if page.section == 'knowledge' %}aria-current="page"{% endif %}>Knowledge Base</a>
  <a href="{{ '/archive/' | relative_url }}" {% if page.section == 'archive' %}aria-current="page"{% endif %}>Archive <span>搜索</span></a>
</div></nav>
<main id="main" class="shell">{{ content }}</main>
<footer class="shell footer"><a class="footer-brand" href="{{ '/' | relative_url }}">Global Intelligence</a><p>保留来源，连接知识。原创摘要与分析，不转载付费全文。</p><div><a href="{{ '/about/' | relative_url }}">关于与投稿</a><a href="https://github.com/{{ site.repository }}">源码与文档 ↗</a><a href="#main">返回顶部 ↑</a></div></footer>
</body>
</html>
